<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopNavBar -->
<header class="bg-surface-container-lowest dark:bg-primary border-b border-outline-variant dark:border-on-primary-fixed-variant">
<div class="flex justify-between items-center max-w-[1200px] mx-auto px-md w-full py-4">
<div class="text-h3 font-h2 text-primary dark:text-primary-fixed">
                SafeDrive Pro
            </div>
<!-- Navigation intent suppressed for linear transactional signup flow per instructions -->
<div class="hidden md:flex gap-md">
<!-- Empty to maintain layout structure if needed, or completely omitted. -->
</div>
<div class="flex items-center gap-sm">
<a class="font-button text-button text-on-surface-variant dark:text-surface-variant hover:text-secondary dark:hover:text-secondary-fixed transition-colors duration-200" href="#">Sign In</a>
<a class="font-button text-button text-primary dark:text-primary-fixed hover:text-secondary dark:hover:text-secondary-fixed transition-colors duration-200" href="#">Sign Up</a>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex w-full">
<div class="flex flex-col lg:flex-row w-full">
<!-- Left Side: Image -->
<div class="hidden lg:block lg:w-1/2 relative bg-surface-container">
<img alt="Confident driving student" class="absolute inset-0 w-full h-full object-cover" data-alt="A high-quality, professional photograph of a young, confident adult student sitting behind the steering wheel of a modern car. The student is smiling slightly, exuding a sense of safety and progression. The lighting is bright and natural, reflecting a clear day, embodying a corporate yet approachable aesthetic. The overall mood is reassuring, with the crisp interior of the vehicle emphasizing a high-standard learning environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHUT3AxXg5HWe-iwD1gonJEG2VY396W7jt88qiFKi3XLXIMmqyMdiM17oClrFyT59IZMkHzk7ooyCkHAx1fJgjMUGkv2h_b6KaTZ0NzXm0DDoOXC4TGs3Pr4A5F26ihw9Bdxp0N3A2DLgdv7W1SJ-i_-RrzpKZJKHtSEUweZAhmSPM7qyqTjUVV8N6qLPBb-B9aUwJP62FRI14NfL1RJ_pFEftKBkw_wkYh3QJVbWRl6lUEDOqcsV12OUZki4pPfdoLZHYlXx9YX4"/>
<!-- Overlay to ensure text readability if any is added later, and to tie into brand colors slightly -->
<div class="absolute inset-0 bg-primary/20"></div>
</div>
<!-- Right Side: Form -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-md lg:p-xl bg-surface-container-lowest">
<div class="w-full max-w-[480px]">
<div class="mb-lg text-center lg:text-left">
<h1 class="font-h1 text-h1 text-primary mb-sm">Create an Account</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Start your journey to safe driving today.</p>
</div>
<!-- Social Signup -->
<div class="flex flex-col gap-sm mb-lg">
<button class="w-full flex items-center justify-center gap-sm py-[12px] px-md border border-outline-variant rounded bg-surface-container-lowest hover:bg-surface-container-low transition-colors duration-200">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant">login</span>
<span class="font-button text-button text-on-surface">Sign up with Google</span>
</button>
<button class="w-full flex items-center justify-center gap-sm py-[12px] px-md border border-outline-variant rounded bg-surface-container-lowest hover:bg-surface-container-low transition-colors duration-200">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant">social_leaderboard</span>
<span class="font-button text-button text-on-surface">Sign up with Facebook</span>
</button>
</div>
<div class="relative flex py-5 items-center mb-lg">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-body-md text-body-md text-on-surface-variant">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-md" method="POST">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface uppercase" for="fullName">Full Name</label>
<input class="w-full px-sm py-[10px] border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors duration-200" id="fullName" name="fullName" placeholder="John Doe" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface uppercase" for="email">Email Address</label>
<input class="w-full px-sm py-[10px] border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors duration-200" id="email" name="email" placeholder="john@example.com" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface uppercase" for="phone">Phone Number</label>
<input class="w-full px-sm py-[10px] border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors duration-200" id="phone" name="phone" placeholder="(555) 000-0000" type="tel"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface uppercase" for="password">Password</label>
<input class="w-full px-sm py-[10px] border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors duration-200" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<div class="flex items-center gap-sm mt-sm">
<input class="w-[16px] h-[16px] border-outline-variant rounded text-secondary-container focus:ring-secondary-container" id="terms" name="terms" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant" for="terms">I agree to the <a class="text-primary underline hover:text-secondary transition-colors" href="#">Terms and Conditions</a></label>
</div>
<button class="w-full py-[14px] bg-secondary-container text-on-primary font-button text-button rounded hover:bg-secondary transition-colors duration-200 mt-sm" type="submit">
                            Create Account
                        </button>
</form>
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                            Already have an account? 
                            <a class="text-primary font-semibold hover:text-secondary transition-colors duration-200" href="#">Sign In</a>
</p>
</div>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-primary dark:bg-on-background border-t border-on-primary-fixed-variant">
<div class="max-w-[1200px] mx-auto px-md py-xl flex flex-col md:flex-row justify-between items-start gap-lg">
<div class="flex flex-col gap-sm">
<span class="text-h3 font-h2 text-on-primary dark:text-primary-fixed">SafeDrive Pro</span>
<span class="font-body-md text-body-md text-on-primary-container dark:text-on-primary-fixed-variant">© 2024 SafeDrive Pro. All rights reserved.</span>
</div>

<div class="flex gap-md flex-wrap">
<a class="font-body-md text-body-md text-on-primary-container dark:text-on-primary-fixed-variant hover:text-secondary-fixed transition-colors duration-200 active:opacity-80" href="#">Privacy Policy</a>
<a class="font-body-md text-body-md text-on-primary-container dark:text-on-primary-fixed-variant hover:text-secondary-fixed transition-colors duration-200 active:opacity-80" href="#">Terms of Service</a>
<a class="font-body-md text-body-md text-on-primary-container dark:text-on-primary-fixed-variant hover:text-secondary-fixed transition-colors duration-200 active:opacity-80" href="#">Legal Information</a>
</div>
</div>
</footer>
